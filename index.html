<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>𝘿𝙟 𝙅𝙖𝙝𝙡𝙞𝙯𝙚 𝙎𝙚𝙡𝙚𝙘𝙩𝙤𝙧 𝙓𝙖𝙩𝙨𝙥𝙖𝙘𝙚</title>

<meta name="theme-color" content="#009b3a">
<meta name="description" content="Positive Conexzion Crew - Reggae & Dancehall Radio">

<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
height:100%;
}

body{

font-family:'Poppins',sans-serif;

background:
linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.75)),
url("https://img.freepik.com/fotos-premium/fondo-bandera-nacional-jamaica-bandera-jamaica_659987-25694.jpg?semt=ais_hybrid&w=740&q=80");

background-size:cover;
background-position:center;
background-repeat:no-repeat;
background-attachment:fixed;

display:flex;
justify-content:center;
align-items:center;
overflow:hidden;

}

/* partículas */

body::before{

content:"";
position:fixed;
inset:0;
pointer-events:none;

background:
radial-gradient(circle,#00ff6630 2px,transparent 3px);

background-size:80px 80px;

animation:move 20s linear infinite;

opacity:.45;

}

@keyframes move{

from{transform:translateY(0);}
to{transform:translateY(80px);}

}

/****************************/

.card{

width:390px;
max-width:95%;

background:rgba(0,0,0,.72);

backdrop-filter:blur(14px);

border-radius:28px;

padding:30px;

text-align:center;

border:2px solid #00ff66;

box-shadow:
0 0 15px #00ff66,
0 0 40px #009933;

animation:fade .8s;

}

@keyframes fade{

from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:none;
}

}

.logo{

width:185px;
height:185px;

border-radius:50%;

border:5px solid #00ff66;

object-fit:cover;

box-shadow:
0 0 15px #00ff66,
0 0 40px #00ff66;

transition:.4s;

}

.logo:hover{

transform:scale(1.05) rotate(3deg);

}

h1{

font-family:'Russo One',sans-serif;

margin-top:20px;

color:#00ff66;

font-size:30px;

text-shadow:0 0 15px #00ff66;

}

.sub{

color:#ffd700;

font-size:15px;

margin-top:10px;

letter-spacing:2px;

}

/***************/

audio{

width:100%;
margin-top:25px;
filter:hue-rotate(60deg);

}

/***************/

.play{

margin-top:20px;

padding:15px;

width:100%;

border:none;

border-radius:50px;

font-size:18px;

font-weight:bold;

cursor:pointer;

background:linear-gradient(90deg,#009933,#00ff66);

color:#000;

transition:.3s;

}

.play:hover{

transform:scale(1.05);

box-shadow:0 0 20px #00ff66;

}

/***************/

.eq{

margin:28px auto;

height:42px;

display:flex;

justify-content:center;

align-items:flex-end;

gap:6px;

}

.eq span{

display:block;

width:8px;

background:#00ff66;

border-radius:20px;

animation:eq .8s infinite ease-in-out;

}

.eq span:nth-child(1){height:15px;}
.eq span:nth-child(2){height:25px;animation-delay:.2s;}
.eq span:nth-child(3){height:35px;animation-delay:.4s;}
.eq span:nth-child(4){height:20px;animation-delay:.6s;}
.eq span:nth-child(5){height:30px;animation-delay:.8s;}
.eq span:nth-child(6){height:18px;animation-delay:1s;}

@keyframes eq{

0%,100%{

transform:scaleY(.4);

}

50%{

transform:scaleY(1.6);

}

}

/***************/

.social{

display:flex;

justify-content:center;

gap:12px;

margin-top:10px;

}

.social a{

text-decoration:none;

padding:10px 18px;

border-radius:40px;

background:#111;

color:#00ff66;

font-size:14px;

border:1px solid #00ff66;

transition:.3s;

}

.social a:hover{

background:#00ff66;

color:#000;

}

/***************/

footer{

margin-top:25px;

font-size:13px;

color:#fff;

line-height:1.7;

opacity:.85;

}

.glow{

color:#00ff66;

font-weight:bold;

}

/***************/

@media(max-width:500px){

.card{

padding:25px;

}

.logo{

width:150px;
height:150px;

}

h1{

font-size:24px;

}

}

</style>

</head>

<body>

<div class="card">

<img class="logo"
src="https://xatimg.com/image/Rc5Mnr1tmJ4o.png"
alt="Positive Conexzion Crew">

<h1>Ɗϳ JλнIιzε ՏҽIҽϲեօɾ☆</h1>

<div class="sub">

REGGAE • ROOTS • DANCEHALL

</div>

<audio
id="radio"
controls
autoplay
preload="none">

<source
src="https://stream.zeno.fm/mwq02npsm2zuv"
type="audio/mpeg">

</audio>

<button
class="play"
onclick="toggleRadio()">

▶ ESCUCHAR EN VIVO

</button>

<div class="eq">

<span></span>
<span></span>
<span></span>
<span></span>
<span></span>
<span></span>

</div>

<div class="social">

<a href="https://conexzion.cl" target="_blank">
WEB
</a>

<a href="https://facebook.com" target="_blank">
FACEBOOK
</a>

<a href="https://instagram.com" target="_blank">
INSTAGRAM
</a>

</div>

<footer>

<div class="glow">

🇯🇲 ONE LOVE 🇯🇲

</div>

Owner En Positive Conexzion Crew<br>

Reggae • Roots • Dancehall<br>

Streaming 24 Horas

</footer>

</div>

<script>

const radio=document.getElementById("radio");
const button=document.querySelector(".play");

function toggleRadio(){

if(radio.paused){

radio.play();

button.innerHTML="⏸ PAUSAR";

}else{

radio.pause();

button.innerHTML="▶ ESCUCHAR EN VIVO";

}

}

radio.addEventListener("play",()=>{

button.innerHTML="⏸ PAUSAR";

});

radio.addEventListener("pause",()=>{

button.innerHTML="▶ ESCUCHAR EN VIVO";

});

</script>

</body>
</html>
